[package]
name = "runner"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
duct = "0.13"
hex = "0.4"
nix = { version = "0.29", features = ["sched", "mount", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"
xdg = "2.5"
libc = "0.2"

[features]
default = ["gma3"]
gma3 = []
